<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#152018" />
    <meta name="description" content="模拟知更鸟在浅色或深色树干上捕食桦尺蛾的课堂实验游戏。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23152018'/%3E%3Cpath d='M5 20c3-8 7-10 11-4 4-6 8-4 11 4-5-2-8 0-11 5-3-5-6-7-11-5Z' fill='%23f3ead5'/%3E%3Ccircle cx='16' cy='13' r='3' fill='%23d86d32'/%3E%3C/svg%3E" />
    <title>桦尺蛾捕食实验</title>
    <link rel="preload" as="image" href="./assets/forest-light-card.jpg" />
    <link rel="preload" as="image" href="./assets/forest-dark-card.jpg" />
    <link rel="stylesheet" href="./styles.css?v=15" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="startScreen" class="screen start-screen" aria-label="选择树干环境">
          <div class="choice-panel">
            <div class="scene-options">
              <button class="scene-card pale" type="button" data-theme="pale" aria-label="选择浅色树干">
                <span class="scene-photo"><img src="./assets/forest-light-card.jpg" data-fallback="./assets/forest-light-reference.jpg" alt="" fetchpriority="high" decoding="async" /></span>
                <span class="scene-meta"><b>浅色<br />树干</b><i>LIGHT<br />BARK</i></span>
                <span class="scene-arrow">进入实验 ↗</span>
              </button>
              <button class="scene-card dark" type="button" data-theme="dark" aria-label="选择深色树干">
                <span class="scene-photo"><img src="./assets/forest-dark-card.jpg" data-fallback="./assets/forest-dark-reference.png" alt="" fetchpriority="high" decoding="async" /></span>
                <span class="scene-meta"><b>深色<br />树干</b><i>DARK<br />BARK</i></span>
                <span class="scene-arrow">进入实验 ↗</span>
              </button>
            </div>
          </div>
      </section>

      <section id="gameScreen" class="screen game-screen is-hidden" aria-label="捕食实验场景">
        <div id="sceneViewport" class="scene-viewport">
          <canvas id="forestCanvas" aria-label="可移动视角的三维森林捕食场景"></canvas>
          <div class="scene-atmosphere" aria-hidden="true"></div>
          <div class="depth-vignette" aria-hidden="true"></div>
          <div class="reticle" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <p id="captureFeedback" class="capture-feedback" aria-live="polite"></p>
          <div id="sceneRefresh" class="scene-refresh" aria-hidden="true"><span>已捕食 · 场景更新中</span><b id="refreshNumber">01 / 10</b></div>
        </div>
        <header class="game-hud">
          <button id="exitButton" class="round-control" type="button" aria-label="退出本局">×</button>
          <div class="hud-pill"><small>剩余时间</small><strong id="timer">02:00</strong></div>
          <div class="hud-title"><span><i class="render-dot"></i><em>森林观察</em> · <span id="environmentLabel">浅色树干</span></span><b>桦尺蛾捕食实验</b></div>
          <div class="hud-pill progress-pill"><small>捕食进度</small><strong><span id="captureCount">0</span> / 10</strong></div>
          <button id="soundButton" class="round-control" type="button" aria-label="切换声音">♫</button>
        </header>
        <div class="bottom-controls">
          <div class="joystick-wrap"><div id="joystick" class="joystick" aria-label="移动与转换视角"><span id="joystickKnob"></span></div><small>移动 / 转向</small></div>
          <p class="desktop-hint">拖动可环顾整片森林 · 方向键移动 · 滚轮缩放 · 空格捕捉</p>
          <button id="captureButton" class="capture-button" type="button"><span class="capture-icon"></span><strong>捕捉</strong></button>
        </div>

        <div id="readyOverlay" class="ready-overlay is-hidden" aria-live="polite">
          <div class="ready-bird"><img src="./assets/robin.png" alt="" /></div>
          <small>准备观察</small>
          <strong id="readyText">3</strong>
          <p>靠近树干，将桦尺蛾对准中央后捕捉</p>
        </div>

        <section id="resultPanel" class="result-panel is-hidden" aria-labelledby="resultEnvironment">
          <div class="result-card">
            <div class="result-content">
              <h2 id="resultEnvironment" class="result-environment">浅色树干</h2>
              <table>
                <thead><tr><th>桦尺蛾类型</th><th>捕食数量</th></tr></thead>
                <tbody>
                  <tr><th><span class="sample-dot light"></span>浅色桦尺蛾</th><td id="lightCaptured">0</td></tr>
                  <tr><th><span class="sample-dot dark"></span>深色桦尺蛾</th><td id="darkCaptured">0</td></tr>
                </tbody>
              </table>
              <div class="result-actions">
                <button id="replayButton" class="primary-action" type="button">再做一次</button>
                <button id="changeSceneButton" class="secondary-action" type="button">更换树干环境</button>
              </div>
            </div>
          </div>
        </section>
        <p id="liveStatus" class="sr-only" aria-live="polite"></p>
      </section>
    </main>
    <script src="./forest-scene.js?v=14"></script>
    <script src="./game.js?v=15"></script>
  </body>
</html>
